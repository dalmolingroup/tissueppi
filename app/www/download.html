<html>
  <head>
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="" />
    <link
      rel="stylesheet"
      as="style"
      onload="this.rel='stylesheet'"
      href="https://fonts.googleapis.com/css2?display=swap&amp;family=Inter%3Awght%40400%3B500%3B700%3B900&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900"
    />

    <title>TissuePPI</title>
    <link rel="icon" type="image/x-icon" href="data:image/x-icon;base64," />

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <style>
        .highlight {
            background-color: #fffde7;
            padding: 20px;
            border-radius: var(--border-radius);
            border-left: 4px solid #f1c40f;
            margin: 20px 0;
        }
        .tech-item {
            background-color: #f1c40f;
            padding: 8px 15px;
            border-radius: 20px;
            color: black;
            font-size: 0.9rem;
            font-weight: 500;
        }
    </style>
    <script>
async function downloadFile(btn) {
    // 1. Desativa o botão e mostra o spinner
    btn.disabled = true;
    btn.style.pointerEvents = 'none';
    btn.style.opacity = '0.6';
    
    // Guarda o texto original e adiciona o spinner
    const textoOriginal = btn.innerHTML;
    btn.innerHTML = '<div class="spinner" style="display:inline-block; vertical-align:middle; margin-right:8px;"></div> Downloading...';

    try {
        // 2. Faz a requisição para o arquivo estático exposto pelo addResourcePath
        const response = await fetch('web_data/interactions.sqlite');
        
        if (!response.ok) throw new Error('Download failed !');

        // Pega o fluxo de dados
        const blob = await response.blob();
        
        // 3. O DOWNLOAD FOI CONCLUÍDO NO NAVEGADOR!
        // Criamos um link temporário invisível para forçar o navegador a salvar o arquivo no disco
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'interactions.sqlite';
        document.body.appendChild(a);
        a.click();
        
        // Limpa a memória
        window.URL.revokeObjectURL(url);
        a.remove();

        console.log("Download completed succesfully!");

    } catch (error) {
        console.error('Download failed:', error);
        alert('An error occurred while downloading the file.');
    } finally {
        // 4. RESTAURA O BOTÃO (Executado obrigatoriamente ao terminar ou se der erro)
        btn.disabled = false;
        btn.style.pointerEvents = 'auto';
        btn.style.opacity = '1';
        btn.innerHTML = textoOriginal;
    }
}
</script>
  </head>
  <body>
    <div style="width: 100%; min-height: 100vh; background: white; display: flex; flex-direction: column;">
        <div style="flex-shrink: 0; background: white;">
            <div style="width: 100%; height: 79px; padding: 12px 40px; border-bottom: 1px #E5E8EB solid; display: flex; justify-content: space-between; align-items: center;">
                <div style="display: flex; justify-content: flex-start; align-items: center; gap: 32px;">
                    <div style="display: flex; justify-content: flex-start; align-items: center; gap: 16px;">
                        <div style="display: inline-flex; flex-direction: column; justify-content: flex-start; align-items: flex-start;">
                            <div style="color: #121417; font-size: 18px; font-family: Inter; font-weight: 700; line-height: 23px; word-wrap: break-word">
                                {{ home }}
                            </div>
                        </div>
                    </div>
                    <div style="display: flex; justify-content: flex-start; align-items: center; gap: 36px;">
                        <div style="display: inline-flex; flex-direction: column; justify-content: flex-start; align-items: flex-start;">
                            <div style="color: #121417; font-size: 14px; font-family: Inter; font-weight: 500; line-height: 21px; word-wrap: break-word">
                                {{ go_home }}
                            </div>
                        </div>
                        <div style="display: inline-flex; flex-direction: column; justify-content: flex-start; align-items: flex-start;">
                            <div style="color: #121417; font-size: 14px; font-family: Inter; font-weight: 500; line-height: 21px; word-wrap: break-word">
                                {{ go_search }}
                            </div>
                        </div>
                        <div style="display: inline-flex; flex-direction: column; justify-content: flex-start; align-items: flex-start;">
                            <div style="color: #121417; font-size: 14px; font-family: Inter; font-weight: 500; line-height: 21px; word-wrap: break-word">
                                {{ go_about }}
                            </div>
                        </div>

                    </div>
                </div>
                <div style="width: 200px; height: 36px; position: relative; overflow: hidden">
                    <a href="https://dalmolingroup.github.io/" target="_blank" style="display: inline-block;">
                      <img src="https://raw.githubusercontent.com/dalmolingroup/dalmolingroup.github.io/refs/heads/main/images/logo_letra_preta.svg" 
                           alt="Logo" style="height: 25px;" />
                    </a>
                </div>
            </div>
        </div>
        
<div style="flex: 1; overflow-y: auto; padding: 20px 160px; display: flex; justify-content: center;">
    <div style="max-width: 960px; width: 100%;">
        <div class="mb-12">
            <h2 class="text-3xl font-bold text-gray-900 mb-6 border-b-2 border-blue-500 pb-2">Large download warning</h2>
            <div class="highlight">
                <p class="mb-0">
                    <i class="fas fa-lightbulb text-yellow-500 mr-2"></i> 
                    You are about to download the entire database. Because of its size, this process might take some time to finish. Click the button below if you want to proceed.
                </p>
            </div>
            <div class="flex flex-wrap gap-3 mb-6">
                <!-- Botão comum que chama a função JavaScript de download -->
                <button id="download_database" 
                        class="btn-download-modern" 
                        onclick="downloadFile(this)">
                    <i class="fas fa-download mr-2"</i>Full Database download
                </button>
            </div>
        </div>
    </div>
</div>
</div>
  </body>
</html>
